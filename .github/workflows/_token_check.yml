name: _token_check

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: 探测 GITHUB_TOKEN 能否创建/删除发行版
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -x
          TAG="token-probe-$(date +%s)"
          if gh release create "$TAG" --repo "$REPO" --draft --title "$TAG" --notes "临时探测, 立即删除"; then
            echo "PROBE_CREATE=OK"
            gh release delete "$TAG" --repo "$REPO" --yes --cleanup-tag && echo "PROBE_DELETE=OK" || echo "PROBE_DELETE=FAIL"
          else
            echo "PROBE_CREATE=FAIL"
          fi
