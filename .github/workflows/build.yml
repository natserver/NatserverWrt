name: Build FanchmWrt RE-SS-01 (26.11) + honk

on:
  # 手动触发 (仅测试/紧急用); 正常只由 schedule 在上游有更新时自动构建
  workflow_dispatch:
  # 每天检查一次上游是否有新提交 (UTC 00:20 = 北京 08:20); 无更新时 check 直接跳过, 不会构建
  # 本仓库 push 不触发任何构建; 构建时自动克隆上游最新源码 (同步在构建内完成)
  schedule:
    - cron: '20 0 * * *'
  # 构建成功自动创建 Release, tag 形如 v20260925-abc1234 (日期+上游短SHA, 同上游版本自动去重)

env:
  REPO_URL: https://github.com/fanchmwrt/fanchmwrt-snapshot.git
  # 26.11 线: kernel 6.18, feeds 不锁 commit (跟随 openwrt master, golang 已是 1.27)
  REPO_BRANCH: fanchmwrt-26.11
  CONFIG_FILE: config/re-ss-01-honk.config
  DIY_P1_SH: scripts/diy-part1.sh
  DIY_P2_SH: scripts/diy-part2.sh
  TZ: Asia/Shanghai

permissions:
  contents: write

jobs:
  # 检查上游 fanchmwrt-snapshot 是否有新提交 (只在定时触发时跳过判断, 手动/push 总是构建)
  check:
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.check.outputs.build }}
      upstream: ${{ steps.check.outputs.upstream }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
    - name: 检查上游更新
      id: check
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -eu
        UP=$(git ls-remote "$REPO_URL" "refs/heads/$REPO_BRANCH" | head -1 | cut -f1)
        SHORT="${UP:0:7}"
        TAG="v$(date -u +%Y%m%d)-${SHORT}"
        BUILD=true
        if [ "${{ github.event_name }}" = "schedule" ]; then
          # 比对 tag+标题+说明里是否已含上游短SHA (v1.0 是旧式tag, SHA在说明里, 所以查body)
          if gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | (.tag_name, .name, .body)' | grep -q "$SHORT"; then
            BUILD=false
            echo "上游 $SHORT 已有对应发行版, 跳过本次构建"
          else
            echo "检测到上游更新: $UP"
          fi
        fi
        echo "upstream=$UP" >> "$GITHUB_OUTPUT"
        echo "tag=$TAG" >> "$GITHUB_OUTPUT"
        echo "build=$BUILD" >> "$GITHUB_OUTPUT"
        echo "build=$BUILD tag=$TAG upstream=$UP"

  build:
    needs: check
    if: needs.check.outputs.build == 'true'

    # 24.04 自带 clang 18; kernel 6.18 的 bpf-headers 硬要求 clang >= 15,
    # 22.04 的 clang 14 会在 oldconfig 阶段直接 *** C compiler is too old 报错退出
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
    - name: Checkout 本仓库(工作流+配置)
      uses: actions/checkout@v4

    - name: 初始化编译环境
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        # 彻底释放 runner 磁盘 (保留 clang/node/runner 本体)
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell \
          /usr/local/share/swift /usr/local/share/edge_driver /opt/hostedtoolcache \
          /usr/local/lib/node_modules /usr/local/typescript /usr/local/go /home/linuxbrew \
          /usr/local/.cache
        # 24.04 的软件源是 /etc/apt/sources.list.d/ubuntu.sources (deb822), 不能整目录删,
        # 只清掉第三方的 .list, 否则 apt-get update 会找不到任何源
        sudo find /etc/apt/sources.list.d -maxdepth 1 -name "*.list" -delete
        sudo docker image prune --all --force 2>/dev/null || true
        sudo -E apt-get -qq update
        PKGS="ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
          bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext git gperf haveged \
          help2man intltool libacl1-dev libattr1-dev libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev \
          libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev libssl-dev \
          libtool libz-dev lld llvm lrzsz mkisofs msmtp nano ninja-build p7zip p7zip-full patch pkgconf \
          python3 python3-pip python3-ply python3-docutils qemu-utils rsync squashfs-tools subversion \
          swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd yasm zlib1g-dev zstd"
        sudo -E apt-get -qq install -y $PKGS || {
          echo "::warning::批量安装失败, 改为逐个安装并跳过 24.04 已移除的包"
          for p in $PKGS; do sudo -E apt-get -qq install -y "$p" || echo "跳过缺失包: $p"; done
        }
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        # kernel 6.18 的 bpf-headers 在 oldconfig 阶段就检查编译器版本, clang < 15 直接退不出构建,
        # 这里提前断言, 别等 1.5 小时才发现
        echo "===== 主机 clang ====="
        clang --version | head -2
        CM=$(clang -dumpversion | cut -d. -f1)
        if [ "$CM" -lt 15 ]; then
          echo "ERROR: 主机 clang $CM < 15, kernel 6.18 的 bpf-headers 会拒绝编译" >&2
          exit 1
        fi
        echo "OK: 主机 clang $CM >= 15"
        df -h

    - name: 克隆 fanchmwrt-snapshot 源码
      run: |
        git clone --depth 1 --branch $REPO_BRANCH $REPO_URL openwrt
        ls -lh openwrt/ | head -30
        # 确认真的在目标分支上, 别拿 26.05 的内核去跑 26.11 的配置
        echo "===== 上游分支 / 提交 ====="
        git -C openwrt rev-parse --abbrev-ref HEAD
        git -C openwrt log -1 --format='%h %ad %s' --date=iso
        echo "===== 内核 patchver (26.11 应为 6.18) ====="
        grep -E '^KERNEL_PATCHVER' openwrt/target/linux/qualcommax/Makefile

    - name: 自定义 feeds (diy-part1, 加 honk 源)
      run: |
        chmod +x $DIY_P1_SH
        cd openwrt
        ../$DIY_P1_SH

    - name: 更新并安装 feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: 自定义配置 (diy-part2)
      run: |
        chmod +x $DIY_P2_SH
        cd openwrt
        ../$DIY_P2_SH
        # 把 config 目录的完整 .config 拷进去并展开 (先删掉旧链接/文件避免 same file 报错)
        rm -f .config
        cp ../$CONFIG_FILE .config
        make defconfig
        echo "===== 生效的关键配置 ====="
        grep -E "jdcloud_re-ss-01|TARGET_qualcommax|BPF_TOOLCHAIN|DEVEL=|PACKAGE_(honk|luci-app-honk|luci-i18n-honk)|KERNEL_DEBUG_INFO|KERNEL_BPF_EVENTS|KERNEL_XDP_SOCKETS|v2ray-geo|kmod-sched-bpf|kmod-veth|kmod-nft-queue" .config || true
        echo "===== 主机 clang (BPF_TOOLCHAIN_HOST 要 >=15) ====="
        which clang llc opt llvm-strip; clang --version | head -2
        echo "===== defconfig 后硬检查 (任一失败立即退出, 不浪费编译时间) ====="
        fail=0
        check() { if ! grep -q "$1" .config; then echo "FAIL: $1"; fail=1; else echo "OK: $1"; fi; }
        check "^CONFIG_TARGET_qualcommax_ipq60xx_DEVICE_jdcloud_re-ss-01=y"
        check "^CONFIG_DEVEL=y"
        check "^CONFIG_BPF_TOOLCHAIN_HOST=y"
        check "^CONFIG_KERNEL_DEBUG_INFO=y"
        check "^CONFIG_KERNEL_DEBUG_INFO_BTF=y"
        # 换了引擎: honk 取代 dae/daed, 这三项是本次改动的核心
        check "^CONFIG_PACKAGE_honk=y"
        check "^CONFIG_PACKAGE_luci-app-honk=y"
        check "^CONFIG_PACKAGE_kmod-nft-queue=y"
        # 旧引擎必须彻底不在, 否则两个 eBPF 程序抢同一批 hook
        if grep -qE "^CONFIG_PACKAGE_(dae|daed|luci-app-daede)=y" .config; then
          echo "FAIL: 仍选中了 dae/daed, 与 honk 冲突"; fail=1
        else
          echo "OK: 已无 dae/daed"
        fi
        check "^CONFIG_PACKAGE_kmod-sched-bpf=y"
        check "^CONFIG_PACKAGE_kmod-veth=y"
        check "^CONFIG_PACKAGE_v2ray-geoip=y"
        check "^CONFIG_KERNEL_CGROUPS=y"
        # RE-SS-01 必须是 12M 内核分区 (diy-part2 打的 HLOS12M 补丁), 否则 FIT 超限
        if sed -n '/^define Device\/jdcloud_re-ss-01$/,/^endef$/p' target/linux/qualcommax/image/ipq60xx.mk | grep -q 'KERNEL_SIZE := 12288k'; then
          echo "OK: RE-SS-01 KERNEL_SIZE := 12288k"
        else
          echo "FAIL: RE-SS-01 KERNEL_SIZE != 12288k"; fail=1
        fi
        if [ "$fail" -ne 0 ]; then echo "ERROR: defconfig 后关键配置丢失"; exit 1; fi
        echo "所有关键配置校验通过"

    - name: 下载源码包 (make download)
      run: |
        cd openwrt
        make download -j$(nproc)
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: 编译固件
      run: |
        cd openwrt
        echo -e "$(nproc) thread compile"
        make -j$(($(nproc)+1)) || make -j1 V=s
        echo "BUILD_STATUS=success" >> $GITHUB_ENV

    - name: 整理固件
      if: env.BUILD_STATUS == 'success'
      run: |
        cd openwrt
        mkdir -p ../firmware
        # 只保留 RE-SS-01 相关固件 + honk 包, 避免 artifact 过大
        find bin/targets/qualcommax/ipq60xx/ -type f \( -name "*re-ss-01*" -o -name "*.manifest" -o -name "config.buildinfo" \) -exec cp -v {} ../firmware/ \;
        # 打包 honk 的 ipk/apks (snapshot 默认是 apk; apk 文件名是 honk-<ver>-r1.apk, 用连字符)
        find bin/packages/ -type f \( -name "honk-*" -o -name "luci-app-honk-*" -o -name "luci-i18n-honk-*" -o -name "v2ray-geo*" \) 2>/dev/null -exec cp -v {} ../firmware/ \; || true
        ls -lh ../firmware/

    - name: 上传固件到 Artifact
      uses: actions/upload-artifact@v4
      if: env.BUILD_STATUS == 'success'
      with:
        name: fanchmwrt-re-ss-01-honk-2611
        path: firmware/*

    - name: 发布到 Release
      if: env.BUILD_STATUS == 'success'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ needs.check.outputs.tag }}
        name: RE-SS-01 + honk ${{ needs.check.outputs.tag }} (26.11 内核6.18, 内置honk, 12M内核)
        target_commitish: ${{ github.sha }}
        files: firmware/*
        body: |
          JDCloud RE-SS-01 (AX1800 Pro) 一体固件, 基于 fanchmwrt-snapshot 26.11 (kernel 6.18)。
          代理引擎已由 dae/daed 换成 **honk** (dae 的 Rust 重写版), 内置 LuCI 管理页与 doona 面板, 开箱即用。

          上游同步: fanchmwrt/fanchmwrt-snapshot@${{ needs.check.outputs.upstream }} (分支 fanchmwrt-26.11)

          ## 本次更新

          - **代理引擎换血**: 移除 dae / daed / luci-app-daede, 改为 honk 2026.11.12 + luci-app-honk
            - honk 走 eBPF 内核态分流, 直连流量几乎零开销, 比 dae 更省内存
            - 核心自带 doona Web 面板 (`/usr/share/doona`), 支持订阅、节点分组、路由与 DNS 可视化调试
            - LuCI 页面支持订阅导入 / 粘贴节点 / 直接导入旧 dae 配置
          - **内核侧不变**: `CONFIG_DEBUG_INFO_BTF=y`, 运行时 `/sys/kernel/btf/vmlinux` 直接做 CO-RE 重定位
          - **依赖补齐**: kmod-nft-queue、kmod-sched-bpf、kmod-veth、sqlite3-cli、coreutils-stat、usign、jsonfilter、v2ray-geoip/geosite
          - **分区不变**: RE-SS-01 内核分区 12 MiB (KERNEL_SIZE 12288k), rootfs 300 MiB
          - **定制不变**: LAN 192.168.100.1、主机名 NatserverWrt、dnsmasq-full

          ## 刷机说明

          - Web 直刷 (原厂/京东云 U-Boot): `*squashfs-factory.bin`
          - 已刷 OpenWrt 升级: `*squashfs-sysupgrade.bin`
          - 从 26.05 (kernel 6.12) 跨到 26.11 (kernel 6.18) 属跨大版本, **不建议保留配置升级**;
            确实要保留, 先备份 `/etc/config/honk` 与 `/etc/honk/`
          - 首次进入 LuCI 后到「网络 - Honk」启动服务, 再到 doona 面板添加节点/订阅

          ## 已知事项

          - honk 为 beta 阶段项目, 上游更新频繁 (2026-11 仍在日更)
          - honk 与 dae 不能共存, 本固件不含任何 dae/daed 组件
